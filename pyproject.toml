[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ors"
version = "0.0.1"
description = "Open Reconstruction Suite"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4",
    "torchvision>=0.19",
    "mitsuba>=3.5",
    "numpy>=1.26",
    "opencv-python>=4.10",
    "pyexr>=0.4",
    "lpips>=0.1.4",
    "tqdm>=4.66",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["ors*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: requires CUDA GPU (deselect with -m 'not gpu')"]
