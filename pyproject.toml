[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oss"
version = "0.2.0.dev0"
description = "OpenSuperSampling"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4,<2.7",
    "torchvision>=0.19,<0.22",
    "mitsuba>=3.5,<4.0",
    "numpy>=1.26,<2.0",
    "opencv-python>=4.10,<5.0",
    "pyexr>=0.4,<1.0",
    "lpips>=0.1.4,<0.2",
    "tqdm>=4.66,<5.0",
    "pyyaml>=6.0,<7.0",
    "zarr>=3.0,<4.0",
    "h5py>=3.10,<4.0",
    "onnx>=1.16,<2.0",
    "onnxruntime>=1.18,<2.0",
    "onnxscript>=0.1,<1.0",
    "requests>=2.31,<3.0",
    "pytorch-wavelets>=1.3,<2.0",
    "pywavelets>=1.5,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6",
    # setuptools provides pkg_resources, which pytorch-wavelets imports at
    # module init. Removed from Python 3.12+ default install AND removed from
    # setuptools 81+, so we must pin <81 to keep pkg_resources available.
    # Without this pin: ImportError chains through oss/model/wavelet.py ->
    # oss/model/oss_pico.py and breaks test collection.
    "setuptools>=68,<81",
    # pytorch-msssim is used by the Gaussian baseline benchmark suite
    # (oss/gaussian/bench/run_baselines.py) and tested in tests/gaussian/test_baselines.py.
    "pytorch-msssim>=1.0",
]
# Anthropic SDK for the OSS-Gaussian sprint review pipeline (--use-api).
# Optional because the pipeline runs a heuristic dry-run by default.
review   = ["anthropic>=0.40"]
cuda     = ["tensorrt>=10.0,<11.0", "onnxruntime-gpu>=1.18,<2.0"]
directml = ["onnxruntime-directml>=1.18,<2.0"]
rocm     = ["onnxruntime-rocm>=1.18,<2.0"]
coreml   = ["coremltools>=8.0,<9.0"]
openvino = ["onnxruntime-openvino>=1.18,<2.0", "openvino>=2024.0,<2026.0"]
# Vulkan compute inference for OSS-Pico / OSS-FX. NCNN is the runtime (BSD-3-Clause,
# first-class Vulkan backend); PNNX is the PyTorch -> NCNN exporter. Both
# ship pre-built wheels for macOS arm64 and Linux x86_64. See
# docs/research/2026-04-30-vulkan-runtime-eval.md for the rationale.
vulkan = ["ncnn>=1.0.20240102", "pnnx>=20240410"]
# RunPod compute provider (second cloud vendor alongside Lambda).
# Used by `oss.cloud.runpod_client` and the `scripts/runpod_*.py` launchers.
# The Lambda code path does NOT require this package — it's intentionally
# a pure optional extra so Lambda-only setups stay slim.
runpod = ["runpod>=1.7"]

[tool.setuptools.packages.find]
include = ["oss*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "cuda: requires custom OSS CUDA extension built and CUDA GPU available",
    "gpu: requires CUDA GPU (deselect with -m 'not gpu')",
    "mitsuba: requires Mitsuba 3 installed",
]
