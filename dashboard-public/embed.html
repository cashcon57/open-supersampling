<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <meta http-equiv="content-security-policy" content="frame-ancestors *">
  <title>OSS embed</title>
  <link rel="icon" href="/favicon.ico">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #0a0a0a;
      color: #e4e4e7;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    body[data-theme="light"] { background: #fafafa; color: #18181b; }
    .embed-root {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      padding: 8px 12px;
      box-sizing: border-box;
    }
    .embed-canvas-wrap {
      position: relative;
      flex: 1 1 auto;
      min-height: 0;
    }
    canvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
    }
    .embed-attribution {
      flex: 0 0 auto;
      font-size: 10px;
      line-height: 1.3;
      color: #71717a;
      text-align: right;
      padding-top: 4px;
    }
    .embed-attribution a { color: inherit; text-decoration: none; }
    .embed-attribution a:hover { text-decoration: underline; }
    .embed-error {
      padding: 12px;
      font-size: 12px;
      color: #f87171;
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>
  <script>
    if (window.Chart && window.ChartZoom) {
      Chart.register(window.ChartZoom);
    }
  </script>
</head>
<body data-theme="dark">
  <div class="embed-root">
    <div class="embed-canvas-wrap"><canvas id="embed-canvas"></canvas></div>
    <div class="embed-attribution">
      <a href="https://opensupersampling.org" target="_blank" rel="noopener">OpenSuperSampling</a>
    </div>
  </div>
  <script type="module">
    import { buildChartById } from "./embed-chart-builder.js";

    const params = new URLSearchParams(location.search);
    const chartId = params.get("chart") || "loss-curve";
    const run = params.get("run") || null;
    const theme = params.get("theme") || "dark";
    document.body.dataset.theme = theme === "light" ? "light" : "dark";

    function renderError(message) {
      const wrap = document.querySelector(".embed-canvas-wrap");
      if (!wrap) return;
      while (wrap.firstChild) wrap.removeChild(wrap.firstChild);
      const div = document.createElement("div");
      div.className = "embed-error";
      div.textContent = message;
      wrap.appendChild(div);
    }

    fetch("./data.json", { cache: "no-store" })
      .then((response) => {
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return response.json();
      })
      .then((data) => {
        const canvas = document.getElementById("embed-canvas");
        try {
          buildChartById(chartId, canvas, data, { run, theme, embed: true });
        } catch (error) {
          renderError(`Failed to render chart "${chartId}": ${error.message}`);
        }
      })
      .catch((error) => renderError(`Failed to load data.json: ${error.message}`));
  </script>
</body>
</html>
