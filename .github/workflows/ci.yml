name: CI

on:
  push:
    branches: [main, "v*-dev"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install (CPU-only, no mitsuba/vulkan extras)
        run: pip install -e ".[dev]"

      - name: Run tests (skip GPU + mitsuba-requiring)
        run: pytest tests/ -v -m "not gpu and not mitsuba" --tb=short
