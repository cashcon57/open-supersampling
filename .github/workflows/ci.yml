name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    name: smoke (Python 3.12, CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install CPU PyTorch + project
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu \
              torch torchvision
          pip install -e ".[dev]"

      - name: v6 test suite (target architecture)
        run: pytest tests/sr/v6/ -q --tb=short

      - name: broader test suite (CPU-friendly slice)
        # Excludes:
        #   - tests/sr/v6 (run separately above for clean signal)
        #   - tests/test_mitsuba_gen.py (Mitsuba build-extras not installed in CI)
        #   - runpod tests (rely on environment-specific mocks)
        run: |
          pytest tests/ -q --tb=short \
              --ignore=tests/sr/v6 \
              --ignore=tests/test_mitsuba_gen.py \
              -k "not runpod"

      - name: v6 smoke train (synthetic data, ~1 minute)
        run: |
          python scripts/sr_train_v6.py --smoke \
              --output-dir /tmp/oss-smoke \
              --device cpu

      - name: Validate dashboard data schema
        run: |
          python scripts/build_public_dashboard.py \
            --runs-dir tests/fixtures/public-dashboard/runs \
            --out /tmp/test-dashboard
          python tools/check_data_schema.py /tmp/test-dashboard/data.json

  v6-e2e-bench:
    name: v6.1 e2e bench gate (CUDA if available)
    runs-on: ${{ vars.CUDA_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Detect CUDA runner
        id: cuda
        run: |
          if command -v nvidia-smi >/dev/null 2>&1 && nvidia-smi -L; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "CUDA not available on this runner; skipping enforced v6.1 e2e bench gate."
          fi

      - name: Set up Python 3.12
        if: steps.cuda.outputs.available == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            oss/cuda/pyproject.toml

      - name: Install CUDA PyTorch + project + custom kernels
        if: steps.cuda.outputs.available == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cu124 \
              torch torchvision
          pip install -e ".[dev]"
          pip install --no-build-isolation -e ./oss/cuda --force-reinstall
          python - <<'PY'
          import torch
          from oss.cuda import oss_cuda

          if not torch.cuda.is_available():
              raise SystemExit("CUDA runner detected, but PyTorch cannot access CUDA")
          if not getattr(oss_cuda.rasterizer, "_COMPILED", False):
              raise SystemExit("oss_cuda extension did not load as a compiled kernel")
          print(torch.cuda.get_device_name(0))
          PY

      - name: Phase 4a v6.1 end-to-end bench regression gate
        if: steps.cuda.outputs.available == 'true'
        run: |
          python tests/cuda/bench_end_to_end_v6.py \
            --shape smoke \
            --warmup 3 \
            --iterations 10 \
            --output-json /tmp/oss-v6.1-e2e-bench-result.json \
            --baseline-json docs/coordination/bench-baseline-v6-e2e.json \
            --check-regression

  lint:
    name: ruff lint (non-blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check . || true
